{% extends "base.html" %}
{% block title %}Author Login{% endblock %}

{% block content %}
<div class="page-header">
    <div class="container">
        <h1>Author Login</h1>
        <p>Access your submissions using your Paper ID and email.</p>
    </div>
</div>

<section class="section">
    <div class="container">
        <div class="track-form">
            <div class="card">
                <div class="card-body">
                    <form method="post">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="form-group">
                            <label>Paper ID</label>
                            <input type="text" name="paper_id" class="form-control" placeholder="e.g., IJMMHRD-2026-A1B2C3" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="Your submission email" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <p class="text-muted text-small">Don't have a Paper ID? <a href="{{ url_for('public.submit_paper') }}">Submit a paper</a> to get one.</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<section class="section" style="text-align:center;padding:6rem 0;">
    <div class="container" style="max-width:540px;">
        <div style="font-family:var(--font-heading);font-size:5.5rem;font-weight:800;color:var(--primary);line-height:1;margin-bottom:0.5rem;">404</div>
        <h2 style="font-size:1.85rem;color:var(--primary);margin-bottom:0.75rem;">Page Not Found</h2>
        <p style="color:var(--gray-600);margin-bottom:2rem;line-height:1.7;">The page or publication resource you are looking for doesn't exist, has been moved, or is unavailable.</p>
        <div class="d-flex gap-2 justify-between flex-wrap" style="justify-content:center;">
            <a href="{{ url_for('public.home') }}" class="btn btn-primary btn-lg">Return to Home Page</a>
            <a href="{{ url_for('public.archives') }}" class="btn btn-outline btn-lg">Browse Archives</a>
        </div>
    </div>
</section>
{% endblock %}
